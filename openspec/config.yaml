schema: spec-driven

context: |
  Tech stack: TypeScript, SolidJS, OpenTUI, Babel, Bun, OpenCode Plugin API
  Language: English
  Writing style: Balanced
  OpenCode TUI plugin that integrates OpenSpec into the terminal UI.
  Provides slash commands for init, config, and spec derivation. Parses OpenSpec markdown files (specs, changes, tasks) to display structured data in a sidebar.

rules:
  proposal:
    - Use standard detail level
    - Always include a Non-goals section
  tasks:
    - Break tasks into ~half-day chunks
    - When a change adds or changes user-facing behavior, include a task to add a MIGRATIONS entry in src/lib/migrations.ts (releaseNotes describing what's new for the user, plus any post-update instructions for the agent). Skip only for internal-only changes with nothing to tell the user or migrate.
